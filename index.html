<style>
:root{--ink:#111;--bg:#fff;--pn:#FAFAFA;--mut:#666;--line:#D4D4D4;--red:#D62828;--on:#fff;--callbg:#D62828;--glow:none;--scan:none;--winsh:6px 6px 0 #111;--btnsh:0 4px 0 #111;--rowact:#eee;--focus:#D62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--ink:#5CFF3B;--bg:#030803;--pn:#061406;--mut:#2E8B22;--line:#1D5A16;--red:#FF5A4D;--on:#031203;--callbg:#5CFF3B;--glow:0 0 6px rgba(92,255,59,.5);--scan:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);--winsh:0 0 18px rgba(92,255,59,.35),inset 0 0 18px rgba(92,255,59,.1);--btnsh:0 0 8px rgba(92,255,59,.35);--rowact:rgba(92,255,59,.2);--focus:#fff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.35 "Share Tech Mono","Courier New",monospace;min-height:100vh;text-shadow:var(--glow)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:var(--scan)}
.win{max-width:520px;margin:12px auto;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--winsh);overflow:hidden;background:var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:3px solid var(--ink);font-size:20px}
.wb{display:flex;gap:8px}.wb i,.wb button{width:34px;height:30px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font:inherit;font-style:normal;color:var(--ink);background:var(--bg)}
.wb button{cursor:pointer}
.body{padding:14px}
.pn{background:var(--pn);border:2px solid var(--ink);border-radius:10px;padding:12px;margin-bottom:14px}
.pn p{margin:0;font-size:22px}
.pb{height:20px;border:2px solid var(--ink);border-radius:4px;padding:2px;margin-top:8px;flex:1}
.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px);transition:width 1.4s steps(30)}
.pl{display:flex;gap:10px;align-items:center}
input[type=search]{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:20px;outline:0}
input::placeholder{color:var(--mut)}
.sr{display:flex;align-items:center;gap:8px}
.sr button{background:var(--bg);border:2px solid var(--ink);border-radius:6px;color:var(--ink);font:inherit;font-size:16px;padding:4px 10px;cursor:pointer}
.call,.b{display:block;text-align:center;text-decoration:none;font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--ink);border-radius:8px;padding:12px;cursor:pointer;box-shadow:var(--btnsh)}
.call{background:var(--callbg);color:var(--on);text-shadow:none;font-weight:700;font-size:24px;margin-bottom:18px}
.b:active,.call:active{transform:translateY(2px);opacity:.8}
.b.go{width:100%;background:var(--ink);color:var(--on);text-shadow:none;font-weight:700;font-size:24px;margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;padding:10px 4px;cursor:pointer}
.row:last-child{border-bottom:0}.row:active{background:var(--rowact)}
.rn{flex:1;font-size:20px}.rn small{display:block;font-size:14px;color:var(--mut)}
.chk{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:2;flex:none}
.msg{font-size:15px;color:var(--mut);margin-bottom:6px}
.st{border-style:double;border-width:5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.st small{display:block;font-size:15px}.st b{font-size:28px;font-weight:400}
select{background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:6px;font:inherit;font-size:14px;padding:4px}
#play,#studio,#contacts{display:none}
.ir select{margin-left:auto}
.ir{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
input[type=text],input[type=tel],textarea{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:18px;outline:0;text-shadow:inherit;resize:vertical}
.ca{display:inline-block;padding:6px 10px;font-size:15px;border-width:2px;box-shadow:none;margin:0}
.srow{border-bottom:1px solid var(--line);padding:10px 0}.srow:last-child{border:0}
.stx{font-size:16px;margin-bottom:8px}.stx.ok::before{content:"[OK] "}
.sbt{display:flex;gap:6px;flex-wrap:wrap}.sbt button{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;text-shadow:inherit}
.sbt button.on{background:var(--red);color:var(--on);text-shadow:none}
.sh{font-size:20px;margin:14px 0 4px}
.fig{padding:6px}.sc{width:100%;height:auto;display:block;stroke:var(--ink);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tx{fill:var(--ink);stroke:none;font:15px "Share Tech Mono",monospace}
#step{font-size:23px;min-height:150px}
.tool{display:none;text-align:center}.tool.show{display:block}
.clock{font-size:44px}
.pump{animation:pump .545s ease-in-out infinite}@keyframes pump{50%{transform:translateY(6px)}}
.arm{transform-origin:150px 66px;animation:armd 2.4s ease-in-out infinite}@keyframes armd{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(70deg)}}
.thr{animation:thr .9s ease-in-out infinite}@keyframes thr{50%{transform:translate(-7px,-5px)}}
.wd{animation:wd 1s linear infinite}@keyframes wd{0%{transform:translateY(0);opacity:1}100%{transform:translateY(50px);opacity:0}}
.shk{animation:shk .12s linear infinite}@keyframes shk{50%{transform:translateX(3px)}}
.hp{transform-origin:172px 72px;animation:hb 1s infinite}@keyframes hb{50%{transform:scale(1.4)}}
.legs{transform-origin:150px 142px;animation:lg 2.6s ease-in-out infinite}@keyframes lg{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-32deg)}}
.drop{animation:dr 1.4s linear infinite}@keyframes dr{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}
.dot{animation:bl 1.2s infinite}@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
textarea:focus-visible,.b:focus-visible,.row:focus-visible,.call:focus-visible,select:focus-visible,.sr button:focus-visible,.wb button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</section>

<section id="play" class="body">

<button class="b" id="cx">DONE</button>
</section>


</div>

<script>

var FLOWS=[
{id:'cpr',name:'CPR',sub:'Not breathing',tool:'metro',steps:[
"This person needs CPR. Call 112 now, or ask someone nearby to call.",
"Lay the person flat on their back, on a hard surface.",
"Kneel beside their chest. Put the heel of one hand in the center of the chest. Put your other hand on top.",
"Push hard and fast. Push down about five centimeters. Let the chest come back up each time. Tap start beat and push with the rhythm.",
"Keep going. Do not stop. If you are trained, give two breaths after every thirty pushes. If not, keep pushing.",
"Keep going until help arrives, or the person starts breathing."]},
{id:'heart',name:'HEART ATTACK',sub:'Chest pain',steps:[
"This may be a heart attack. Call 112 now.",
"Help the person sit down and rest.",
"Loosen any tight clothing.",
"If they are not allergic to aspirin, have them chew one adult aspirin.",
"Stay with them and keep them calm.",
"If they stop responding and stop breathing, go back and start CPR."]},
{id:'stroke',name:'STROKE',sub:'Face, arm, speech',steps:[
"This may be a stroke. Call 112 now.",
"Face. Ask the person to smile. Does one side of the face droop?",
"Arms. Ask them to raise both arms. Does one arm drop?",
"Speech. Ask them to say a simple sentence. Is it slurred or confused?",
"Note the time the symptoms began. Tell the paramedics.",
"Keep the person sitting or lying down, calm and still. Do not give food, drink, or medicine."]},
{id:'bleed',name:'BLEEDING',sub:'Cuts and wounds',tool:'timer',steps:[
"Stay calm. Call 112 if the bleeding is heavy.",
"Press firmly on the wound with a clean cloth.",
"Do not lift the cloth to check. If it soaks through, add more cloth on top.",
"If it is an arm or leg, raise it above the heart.",
"Keep pressing for ten minutes. Tap start timer and I will tell you when time is up.",
"Once it slows, bandage firmly, but not so tight it cuts off blood flow. Keep the person warm and lying down."]},
{id:'faint',name:'FAINTING',sub:'Passed out',steps:[
"Lay the person flat on their back.",
"Raise their legs about thirty centimeters.",
"Loosen tight clothing. Give them fresh air.",
"They should wake within a minute. If not, call 112.",
"When they wake, let them rest. Give water only when fully alert. Help them sit up slowly."]},
{id:'mind',name:'FEELING LOW',sub:'Depression, crisis',steps:[
"Stay calm and stay with them.",
"Listen without judging. Let them talk.",
"Ask clearly: are you thinking of hurting yourself?",
"If yes, do not leave them alone. Remove anything they could use to hurt themselves, if it is safe. Call 112 or a crisis line now.",
"If no, encourage them to see a doctor or counselor. Offer to go with them.",
"Check in with them again tomorrow."]},
{id:'choke',name:'CHOKING',sub:'Cannot cough or speak',steps:[
"This guide is for adults and children over one year. For a baby, call 112 now.",
"If they can cough, tell them to keep coughing. Do not hit their back yet.",
"If they cannot cough, speak, or breathe, call 112 now, or shout for someone to call.",
"Stand behind them. Lean them forward. Give five firm blows between the shoulder blades with the heel of your hand.",
"Still choking? Make a fist above the belly button. Pull hard inward and upward. Give five thrusts.",
"Keep going, five back blows, then five thrusts, until it comes out or help arrives.",
"If they pass out, lay them down and start CPR."]},
{id:'burn',name:'BURNS',sub:'Hot water, fire, oil',steps:[
"Move away from the heat. Make sure you are both safe.",
"Cool the burn under cool running water for at least twenty minutes.",
"Take off rings, watches, and tight clothing near the burn before it swells. Do not pull off anything stuck to the skin.",
"Do not use ice, butter, oil, or toothpaste.",
"Cover loosely with clean cling film or a clean, non-fluffy cloth. Do not burst blisters.",
"Call 112 if the burn is large, deep, on the face, hands, or private parts, or caused by chemicals or electricity."]},
{id:'seizure',name:'SEIZURE',sub:'Shaking, fits',steps:[
"Stay calm. Note the time the seizure started.",
"Clear the area. Move hard or sharp things away.",
"Cushion their head with something soft. Do not hold them down.",
"Do not put anything in their mouth.",
"When the shaking stops, roll them onto their side. Tilt the head back slightly to help them breathe.",
"Call 112 if it lasts more than five minutes, they do not wake up, they are hurt or pregnant, or it happens again.",
"Stay with them until fully awake. Speak gently."]},
{id:'call',fig:'general',name:'CALL SCRIPT',sub:'What to tell the operator',steps:[
"Call 112. Stay calm. Speak slowly and clearly.",
"Say where you are. Give the street, landmark, or area. This is the most important part.",
"Say what happened. For example: my father collapsed and is not breathing.",
"Say how many people are hurt, their age, and whether they are awake and breathing.",
"Answer the operator's questions. Do not hang up until they tell you to.",
"If you can, send someone outside to guide the ambulance.",
"Stay with the person and follow the operator's instructions."]},
{id:'asthma',fig:'heart',name:'ASTHMA',sub:'Wheezing, hard to breathe',steps:[
"Help the person sit upright. Stay calm and speak slowly.",
"Help them take their own reliever inhaler, as prescribed.",
"Loosen tight clothing and open a window for fresh air.",
"Call 112 if there is no improvement in a few minutes, they cannot speak, or their lips turn blue.",
"If they stop breathing, start CPR."]},
{id:'allergy',fig:'general',name:'ALLERGY',sub:'Swelling, hives, stings',steps:[
"Call 112 now if there is swelling of the face or throat, trouble breathing, or they feel faint.",
"If they have an adrenaline pen, help them use it right away on the outer thigh.",
"Lay them flat with legs raised. If breathing is hard, let them sit up.",
"Stay with them. Do not give food or drink.",
"Be ready to start CPR if they stop breathing."]},
{id:'snake',fig:'general',name:'SNAKE BITE',sub:'Bites and stings',steps:[
"Move away from the snake. Do not try to catch or kill it.",
"Call 112 or get to a hospital now. Antivenom is the treatment.",
"Keep the person calm and still. Keep the bitten limb still, at about heart level.",
"Remove rings and tight items near the bite before it swells.",
"Do not cut the bite, suck it, apply ice, tie a tight band, or use herbs."]},
{id:'fracture',fig:'general',name:'BROKEN BONE',sub:'Falls, sprains, head injury',steps:[
"If you suspect a neck, back, or head injury, do not move the person. Call 112.",
"Keep the injured part still. Support it in the position you found it.",
"If there is bleeding, press gently around the wound with a clean cloth.",
"Do not try to straighten the bone or push it back in.",
"Get medical help. Keep the person warm and calm."]},
{id:'poison',fig:'general',name:'POISONING',sub:'Swallowed something harmful',steps:[
"Call 112 now. Find out what was swallowed, how much, and when.",
"Do not make the person vomit. Do not give milk, food, or drinks unless told to.",
"If they are awake, keep them calm and sitting. If drowsy, lay them on their side.",
"Keep the container or a sample to show the doctor.",
"If they stop breathing, start CPR."]},
{id:'fever',fig:'general',name:'FEVER',sub:'Malaria, flu, pain, vomiting',steps:[
"Call 112 if they are confused, have a stiff neck, a seizure, trouble breathing, or are very drowsy.",
"Remove extra clothing. Keep the room cool and give plenty of fluids.",
"In Nigeria, fever can be malaria. Get a malaria test at a clinic today.",
"A baby under three months with any fever must go to hospital at once.",
"Ask a pharmacist about fever medicine. Do not give aspirin to children."]},
{id:'other',fig:'general',name:'NOT SURE',sub:'Any other symptom',steps:[
"If the person is not breathing, unconscious, has severe chest pain, heavy bleeding, or cannot speak, call 112 now.",
"Stay with them. Keep them calm, and let them rest in a comfortable position.",
"Do not give food, drink, or medicine unless a doctor has said so.",
"If it is not an emergency, see a doctor or clinic today. Tell them when it started and what changed.",
"If it gets worse, or you are worried, call 112 or go to the nearest hospital."]}
];
var TR={
yo:{
cpr:["Ẹni yìí nílò CPR. Pe 112 nísinsìnyí, tàbí ké sí ẹnìkan nítòsí láti pè é.","Gbé ẹni náà sùn lórí ẹ̀yìn rẹ̀, lórí ilẹ̀ líle.","Kúnlẹ̀ sí ẹ̀gbẹ́ àyà rẹ̀. Fi àtẹ́lẹwọ́ kan sí àárín àyà. Fi ọwọ́ kejì lé e lórí.","Tẹ̀ ẹ́ le, kí o sì tẹ̀ ẹ́ kíákíá, tó sẹ̀ǹtímítà márùn-ún jìn. Jẹ́ kí àyà gbéra sókè lẹ́ẹ̀kan sí i. Tẹ START BEAT kí o sì tẹ̀ bí ìlù ṣe ń lọ.","Máa tẹ̀ síwájú. Má dúró. Tí o bá mọ̀ ọ́n, fún un ní èémí méjì lẹ́yìn gbogbo ìtẹ̀ ọgbọ̀n. Tí kò bá rí bẹ́ẹ̀, máa tẹ̀ nìkan.","Máa ṣe é títí ìrànlọ́wọ́ yóò fi dé, tàbí ẹni náà yóò fi bẹ̀rẹ̀ sí í mí."],
heart:["Èyí lè jẹ́ àrùn ọkàn. Pe 112 nísinsìnyí.","Ran ẹni náà lọ́wọ́ láti jókòó kí ó sì sinmi.","Tú aṣọ tó há mọ́ ọn sílẹ̀.","Tí aspirin kò bá ṣe é ní ibi, jẹ́ kí ó jẹ aspirin àgbàlagbà kan.","Dúró tì í kí o sì mú un balẹ̀.","Tí kò bá dá ọ̀rọ̀ mọ́, tí kò sì mí mọ́, padà sẹ́yìn kí o bẹ̀rẹ̀ CPR."],
stroke:["Èyí lè jẹ́ àrùn ẹ̀gbà (stroke). Pe 112 nísinsìnyí.","Ojú. Sọ fún un kí ó rẹ́rìn-ín. Ṣé ẹ̀gbẹ́ kan ojú rẹ̀ ń sàlẹ̀?","Ọwọ́. Sọ fún un kí ó gbé ọwọ́ méjèèjì sókè. Ṣé ọwọ́ kan ń já bọ́lẹ̀?","Ọ̀rọ̀. Sọ fún un kí ó sọ gbólóhùn kékeré kan. Ṣé ọ̀rọ̀ rẹ̀ dàrú tàbí kò yé ọ?","Kọ àkókò tí àmì bẹ̀rẹ̀. Sọ fún àwọn òṣìṣẹ́ ìrànlọ́wọ́.","Jẹ́ kí ó jókòó tàbí sùn ní ìbàlẹ̀. Má fún un ní oúnjẹ, omi tàbí oògùn."],
bleed:["Fara balẹ̀. Pe 112 tí ẹ̀jẹ̀ bá pọ̀.","Tẹ ọgbẹ́ náà le pẹ̀lú aṣọ mímọ́.","Má gbé aṣọ náà láti wò ó. Tí ẹ̀jẹ̀ bá wọlé, fi aṣọ mìíràn lé e lórí.","Tí ó bá jẹ́ apá tàbí ẹsẹ̀, gbé e sókè ju ọkàn lọ.","Máa tẹ̀ ẹ́ fún ìṣẹ́jú mẹ́wàá. Tẹ START TIMER, èmi yóò sọ nígbà tí àkókò bá tán.","Nígbà tí ó bá dínkù, dì í, ṣùgbọ́n má ṣe le jù. Jẹ́ kí ẹni náà móoru kí ó sì sùn."],
faint:["Gbé ẹni náà sùn lórí ẹ̀yìn rẹ̀.","Gbé ẹsẹ̀ rẹ̀ sókè tó sẹ̀ǹtímítà ọgbọ̀n.","Tú aṣọ tó há. Jẹ́ kí afẹ́fẹ́ tútù wọlé.","Ó yẹ kí ó jí láàárín ìṣẹ́jú kan. Tí kò bá jí, pe 112.","Nígbà tí ó bá jí, jẹ́ kí ó sinmi. Fún un ní omi nígbà tí ó bá jí dáadáa. Ran án lọ́wọ́ láti jókòó díẹ̀díẹ̀."],
mind:["Fara balẹ̀, kí o sì dúró tì í.","Fetí sílẹ̀ láì dá a lẹ́bi. Jẹ́ kí ó sọ̀rọ̀.","Béèrè ní gbangba: ṣé ò ń ronú láti pa ara rẹ lára?","Tí ó bá sọ bẹ́ẹ̀, má fi sílẹ̀ nìkan. Mú ohunkóhun tó lè fi pa ara rẹ̀ lára kúrò, tí ó bá dájú. Pe 112 tàbí ìlà ìrànlọ́wọ́ nísinsìnyí.","Tí kò bá sọ bẹ́ẹ̀, gba á níyànjú láti rí dókítà tàbí olùgbaninímọ̀ràn. Fi ara rẹ lọ́wọ́ láti bá a lọ.","Padà wo ọ̀rọ̀ rẹ̀ lọ́la."],
choke:["Ìtọ́nisọ́nà yìí wà fún àgbàlagbà àti ọmọdé tó ju ọdún kan lọ. Fún ọmọ ọwọ́, pe 112 nísinsìnyí.","Tí ó bá lè wúkọ́, sọ fún un kí ó máa wúkọ́ lọ. Má lù ú ní ẹ̀yìn síbẹ̀.","Tí kò bá lè wúkọ́, sọ̀rọ̀ tàbí mí, pe 112 nísinsìnyí, tàbí kígbe fún ẹni tí yóò pè é.","Dúró lẹ́yìn rẹ̀. Tẹ̀ ẹ́ síwájú. Fi ìdí ọwọ́ rẹ lù ú ní ẹ̀yìn, láàárín èjìká, ní ẹ̀ẹ̀marùn-ún.","Tí kò bá tíì jáde, há ọwọ́ rẹ mọ́ra sókè ìdodo. Fà á wọlé àti sókè le, ní ẹ̀ẹ̀marùn-ún.","Máa ṣe é lọ, ẹ̀ẹ̀marùn-ún ẹ̀yìn, ẹ̀ẹ̀marùn-ún ikùn, títí yóò fi jáde tàbí ìrànlọ́wọ́ yóò fi dé.","Tí ó bá dákú, gbé e sùn kí o sì bẹ̀rẹ̀ CPR."],
burn:["Kúrò níbi ooru. Rí i dájú pé ẹ̀yin méjèèjì wà ní àìléwu.","Da omi tútù tó ń ṣàn sórí ìjóná náà fún ó kéré tán ìṣẹ́jú ogún.","Bọ́ òrùka, aago àti aṣọ tó há nítòsí ibẹ̀ kí ó tó wú. Má fa ohunkóhun tó ti lẹ̀ mọ́ awọ ara.","Má lo yìnyín, bọ́tà, òróró tàbí ọṣẹ eyín.","Fi aṣọ mímọ́ bò ó díẹ̀. Má fọ́ àwọn ìṣú omi tó yọ.","Pe 112 tí ìjóná bá tóbi, jìn, wà ní ojú, ọwọ́, tàbí ẹ̀yà ìkọ̀kọ̀, tàbí kẹ́míkà tàbí iná mànàmáná ló fà á."],
seizure:["Fara balẹ̀. Kọ àkókò tí ó bẹ̀rẹ̀.","Mú àwọn ohun líle tàbí mímú kúrò ní àyíká rẹ̀.","Fi ohun rírọ̀ gbé orí rẹ̀. Má dì í mú.","Má fi ohunkóhun sí ẹnu rẹ̀.","Nígbà tí ara rẹ̀ bá dákẹ́ gbọ̀n, yí i sí ẹ̀gbẹ́ rẹ̀. Gbé orí rẹ̀ sẹ́yìn díẹ̀ kí ó lè mí.","Pe 112 tí ó bá ju ìṣẹ́jú márùn-ún lọ, tí kò bá jí, tí ó bá farapa tàbí lóyún, tàbí tí ó tún padà.","Dúró tì í títí yóò fi jí dáadáa. Bá a sọ̀rọ̀ pẹ̀lú ìrẹ̀lẹ̀."],
call:["Pe 112. Fara balẹ̀. Sọ̀rọ̀ díẹ̀díẹ̀ kí ó ṣe kedere.","Sọ ibi tí o wà. Sọ òpópónà, àmì ibi, tàbí agbègbè. Èyí ni ohun tó ṣe pàtàkì jù.","Sọ ohun tó ṣẹlẹ̀. Fún àpẹẹrẹ: bàbá mi ṣubú, kò sì mí.","Sọ iye àwọn tó farapa, ọjọ́ orí wọn, àti bóyá wọ́n jí, wọ́n sì ń mí.","Dáhùn àwọn ìbéèrè ẹni tó gbà ìpè. Má gbé fóònù kúrò títí yóò fi sọ fún ọ.","Tí o bá lè, rán ẹnìkan síta láti tọ́ ọkọ̀ aláìsàn sọ́nà.","Dúró pẹ̀lú ẹni náà kí o sì tẹ̀lé ìtọ́ni ẹni tó gbà ìpè."],

$('slang').value=SET.lang;$('sgen').value=SET.gender;vmsg();
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=vmsg;
$('slang').onchange=function(){SET.lang=this.value;saveSet();vmsg()};
$('sgen').onchange=function(){SET.gender=this.value;saveSet()};
$('stest').onclick=function(){var v=voice;voice=true;say(TEST[SET.lang]);voice=v};
function applyTheme(){document.documentElement.setAttribute('data-theme',SET.theme);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=SET.theme=='dark'?'#000000':'#ffffff';$('sthm').value=SET.theme}
$('sthm').onchange=function(){SET.theme=this.value;saveSet();applyTheme()};
$('thm').onclick=function(){SET.theme=SET.theme=='dark'?'light':'dark';saveSet();applyTheme()};
applyTheme();
function typeIn(t){clearInterval(ty);var el=$('step'),i=0;el.textContent='> ';
if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent='> '+t;return}
ty=setInterval(function(){i++;el.textContent='> '+t.slice(0,i);if(i>=t.length)clearInterval(ty)},18)}

function go(f){cur=f;idx=0;f.use=f.ai?f.steps:stepsOf(f);f.en=SET.lang!='en'&&!f.ai&&f.use===f.steps;$('vnote').textContent='';$('home').style.display='none';$('play').style.display='block';$('wt').textContent=f.name.replace(/ /g,'_')+'.exe';

$('metro').className='pn tool'+(f.tool=='metro'?' show':'');$('timer').className='pn tool'+(f.tool=='timer'?' show':'');
stopAll();render(true);window.scrollTo(0,0)}
function showFig(){var a=cur.ai?cur.poses:STEPFIG[cur.id];var k=a&&a[idx];
if(!S[k])k=cur.fig||cur.id;if(!S[k])k='general';
$('fig').innerHTML='<svg class="sc" viewBox="0 0 300 180" role="img" aria-label="Posture for step '+(idx+1)+'">'+S[k]+'</svg>'}
function render(sp){var s=cur.use;showFig();typeIn(s[idx]);
$('count').textContent='> STEP '+(idx+1)+' / '+s.length+(cur.en?' [ENGLISH ONLY]':'');$('pf').style.width=Math.round((idx+1)/s.length*100)+'%';
$('next').innerHTML=idx==s.length-1?'DONE [OK]':'NEXT &#9654;';if(sp)say(s[idx])}
$('next').onclick=function(){if(idx<cur.use.length-1){idx++;render(true)}else exit()};
$('back').onclick=function(){if(idx>0){idx--;render(true)}};
$('rep').onclick=function(){say(cur.use[idx])};
$('mute').onclick=function(){voice=!voice;this.textContent='VOICE: '+(voice?'ON':'OFF');if(!voice)stopVoice()};
$('x').onclick=exit;
function exit(){if($('home').style.display!='none')return;stopAll();clearInterval(ty);stopVoice();
$('play').style.display='none';$('contacts').style.display='none';$('home').style.display='block';$('wt').textContent='FIRSTAID.exe';search($('q').value)}

var PWA=true,DP=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DP=e});
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('inst').style.display='none';
$('inst').onclick=function(){var m=$('imsg');
if(DP){DP.prompt();DP=null;return}
m.textContent=PWA?'> iPhone: tap Share, then Add to Home Screen. Android: tap the browser menu, then Install app.':'> This page can only save a shortcut. For full offline use, install from the hosted app copy.'};
var CT=[],MED='';
try{CT=JSON.parse(localStorage.getItem('faCt')||'[]');MED=localStorage.getItem('faMed')||''}catch(e){}
function saveCt(){try{localStorage.setItem('faCt',JSON.stringify(CT))}catch(e){}}
function ph(p){return String(p).replace(/[^+0-9]/g,'')}
function renderCt(){var b=$('clist');b.innerHTML='';
if(!CT.length)b.innerHTML='<div class="msg">&gt; NO CONTACTS YET. Add a family member below.</div>';
CT.forEach(function(c,i){var r=document.createElement('div');r.className='srow';
var tx=document.createElement('div');tx.className='stx';tx.textContent=c.n+'  '+c.p;r.appendChild(tx);
var bt=document.createElement('div');bt.className='sbt';
var a=document.createElement('a');a.className='b ca';a.href='tel:'+ph(c.p);a.textContent='CALL';bt.appendChild(a);
var m=document.createElement('a');m.className='b ca';m.href='sms:'+ph(c.p);m.textContent='SMS';bt.appendChild(m);
var d=document.createElement('button');d.innerHTML='&#10005;';d.setAttribute('aria-label','Delete '+c.n);d.onclick=function(){CT.splice(i,1);saveCt();renderCt()};bt.appendChild(d);
r.appendChild(bt);b.appendChild(r)})}
$('cadd').onclick=function(){var n=$('cn').value.trim(),p=$('cp').value.trim();
if(!n||ph(p).length<3){$('cmsg').textContent='> Enter a name and a phone number.';return}
if(CT.length>=8){$('cmsg').textContent='> You can save up to 8 contacts.';return}
CT.push({n:n,p:p});saveCt();$('cn').value=$('cp').value='';$('cmsg').textContent='';renderCt()};
$('med').value=MED;
$('med').oninput=function(){MED=this.value;try{localStorage.setItem('faMed',MED)}catch(e){}};
$('calert').onclick=function(){
if(!CT.length){$('cmsg').textContent='> Add at least one contact first.';return}
$('cmsg').textContent='> Getting your location...';
var nums=CT.map(function(c){return ph(c.p)}).join(',');
function ready(loc){var m='EMERGENCY. I need help.'+(loc?' My location: https://maps.google.com/?q='+loc:'')+(MED?' Medical info: '+MED:'');
var a=$('alink');a.href='sms:'+nums+'?&body='+encodeURIComponent(m);a.style.display='block';
$('cmsg').textContent=loc?'> Location found. Tap the button below to send.':'> No location. Message is ready without it.'}
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){ready(p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5))},function(){ready('')},{timeout:8000});else ready('')};
$('ctb').onclick=function(){$('home').style.display='none';$('contacts').style.display='block';$('wt').textContent='CONTACTS.exe';$('alink').style.display='none';$('cmsg').textContent='';renderCt();window.scrollTo(0,0)};
$('cx').onclick=function(){exit()};

function beep(){try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),v=ac.createGain();
o.type='square';o.frequency.value=880;v.gain.value=.15;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.06)}catch(e){}}
$('mbtn').onclick=function(){if(mt){stopAll();return}beep();mt=setInterval(beep,60000/110);this.textContent='STOP BEAT'};
function fmt(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
$('tbtn').onclick=function(){if(tt){stopAll();return}
tleft=600;$('clock').textContent=fmt(tleft);this.textContent='STOP TIMER';
tt=setInterval(function(){tleft--;$('clock').textContent=fmt(tleft);
if(tleft==300)say(exl(0));
if(tleft<=0){stopAll();say(exl(1))}},1000)};
function stopAll(){clearInterval(mt);clearInterval(tt);mt=tt=null;$('mbtn').textContent='START BEAT';$('tbtn').textContent='START 10 MIN TIMER';$('clock').textContent='10:00'}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
</body>
</html>
